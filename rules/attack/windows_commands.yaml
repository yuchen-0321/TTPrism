# Map Windows command lines seen in sandbox runs to ATT&CK techniques.
#
# A command line is split into the commands chained with & && ||. Commands and
# phrases are lower-cased, cmd.exe caret escapes are removed
# (s^c^h^t^a^s^k^s), Unicode dashes become "-", glued switches are split
# (del/f/q) and whitespace is collapsed. Each command is matched twice: with
# quotes turned into spaces and with quotes deleted (cmd.exe runs s"c"htasks as
# schtasks). A phrase must not be part of a longer word ("_" counts as a
# letter), so "net view" does not match "Net.WebClient" or "example.net/view",
# and a switch must be a word of its own. See rules/attack/README.md.
#
# An inner list means every phrase must appear in the same command, in any
# order, so [vssadmin, delete shadows] matches both "vssadmin delete shadows"
# and "C:\Windows\System32\vssadmin.exe Delete Shadows /All /Quiet". Use one
# phrase ("net user") where words must be adjacent, exclude_commands for
# commands the rule must ignore, and chained_commands for idioms that span
# chained commands.
#
# Prefer specific, high-precision phrases. A rule that fires on every benign
# use of a tool belongs at confidence: low, or not at all.

attack_version: "19.2"

rules:
  # --- Execution ---------------------------------------------------------------
  - id: cmd.powershell
    technique: T1059.001
    confidence: high
    description: PowerShell started by the sample.
    references:
      - https://attack.mitre.org/techniques/T1059/001/
    match:
      commands: [powershell, pwsh, powershell_ise]

  - id: cmd.powershell-encoded
    technique: T1027.010
    confidence: high
    description: PowerShell with a Base64-encoded command (-EncodedCommand, any abbreviation, or -ec).
    references:
      - https://attack.mitre.org/techniques/T1027/010/
      - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe?view=powershell-5.1
      - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pwsh
    match:
      # Every prefix of -EncodedCommand works, as does the -ec alias, and "/" works like "-". "/e"
      # alone is left out: it is also the /E switch of robocopy and xcopy run from PowerShell.
      commands: [
        [powershell, -e], [powershell, -ec], [powershell, -en], [powershell, -enc], [powershell, -enco],
        [powershell, -encod], [powershell, -encode], [powershell, -encoded], [powershell, -encodedc],
        [powershell, -encodedco], [powershell, -encodedcom], [powershell, -encodedcomm],
        [powershell, -encodedcomma], [powershell, -encodedcomman], [powershell, -encodedcommand],
        [powershell, /ec], [powershell, /en], [powershell, /enc], [powershell, /enco],
        [powershell, /encod], [powershell, /encode], [powershell, /encoded], [powershell, /encodedc],
        [powershell, /encodedco], [powershell, /encodedcom], [powershell, /encodedcomm],
        [powershell, /encodedcomma], [powershell, /encodedcomman], [powershell, /encodedcommand],
        [pwsh, -e], [pwsh, -ec], [pwsh, -en], [pwsh, -enc], [pwsh, -enco], [pwsh, -encod], [pwsh, -encode],
        [pwsh, -encoded], [pwsh, -encodedc], [pwsh, -encodedco], [pwsh, -encodedcom], [pwsh, -encodedcomm],
        [pwsh, -encodedcomma], [pwsh, -encodedcomman], [pwsh, -encodedcommand],
        [pwsh, /ec], [pwsh, /en], [pwsh, /enc], [pwsh, /enco], [pwsh, /encod], [pwsh, /encode],
        [pwsh, /encoded], [pwsh, /encodedc], [pwsh, /encodedco], [pwsh, /encodedcom], [pwsh, /encodedcomm],
        [pwsh, /encodedcomma], [pwsh, /encodedcomman], [pwsh, /encodedcommand],
      ]

  - id: cmd.cmd-shell
    technique: T1059.003
    confidence: medium
    description: Commands run through cmd.exe.
    references:
      - https://attack.mitre.org/techniques/T1059/003/
    match:
      commands: [[cmd, /c], [cmd, /k], [cmd, /r]]  # also "cmd/c" and "cmd /q/c": glued switches split

  - id: cmd.vbscript
    technique: T1059.005
    confidence: high
    description: VBScript run with the Windows Script Host or mshta.
    references:
      - https://attack.mitre.org/techniques/T1059/005/
    match:
      commands:
        - [wscript, .vbs]
        - [cscript, .vbs]
        - [wscript, .vbe]
        - [cscript, .vbe]
        - [mshta, "vbscript:"]

  - id: cmd.jscript
    technique: T1059.007
    confidence: high
    description: JScript run with the Windows Script Host or mshta.
    references:
      - https://attack.mitre.org/techniques/T1059/007/
    match:
      commands:
        - [wscript, .js]
        - [cscript, .js]
        - [wscript, .jse]
        - [cscript, .jse]
        - [mshta, "javascript:"]

  - id: cmd.wmi-process-create
    technique: T1047
    confidence: high
    description: Process created through WMI.
    references:
      - https://attack.mitre.org/techniques/T1047/
    match:
      commands:
        - [wmic, process, call, create]
        - invoke-wmimethod
        - invoke-cimmethod

  - id: cmd.wmic
    technique: T1047
    confidence: low
    description: Any use of wmic.
    references:
      - https://attack.mitre.org/techniques/T1047/
    match:
      commands: [wmic]

  - id: cmd.service-execution
    technique: T1569.002
    confidence: medium
    description: Programs started as a service (PsExec, sc start, net start <service>, Start-Service).
    references:
      - https://attack.mitre.org/techniques/T1569/002/
    match:
      # A bare "net start" lists the running services instead.
      commands: [
        psexec, psexec64, sc start, sc.exe start, start-service,
        net start <arg>, net.exe start <arg>, net1 start <arg>, net1.exe start <arg>,
      ]

  - id: cmd.remote-service-execution
    technique: T1569.002
    confidence: medium
    description: Service started on another host with sc \\host start.
    references:
      - https://attack.mitre.org/techniques/T1569/002/
    match:
      commands: [['sc \\', start], ['sc.exe \\', start]]
      exclude_commands: [start=]  # the start type of sc config / sc create, not the start command

  # --- System binary proxy execution ---------------------------------------
  - id: cmd.mshta
    technique: T1218.005
    confidence: high
    description: mshta.exe used to run HTA or inline script.
    references:
      - https://attack.mitre.org/techniques/T1218/005/
      - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
    match:
      commands: [mshta]

  - id: cmd.regsvr32-scriptlet
    technique: T1218.010
    confidence: high
    description: regsvr32 loading a remote or COM scriptlet ("Squiblydoo").
    references:
      - https://attack.mitre.org/techniques/T1218/010/
      - https://lolbas-project.github.io/lolbas/Binaries/Regsvr32/
    match:
      commands:
        - [regsvr32, scrobj.dll]
        - [regsvr32, "/i:http:"]
        - [regsvr32, "/i:https:"]
        - [regsvr32, "-i:http:"]
        - [regsvr32, "-i:https:"]

  - id: cmd.rundll32
    technique: T1218.011
    confidence: medium
    description: rundll32.exe started by the sample.
    references:
      - https://attack.mitre.org/techniques/T1218/011/
      - https://lolbas-project.github.io/lolbas/Binaries/Rundll32/
    match:
      commands: [rundll32]

  # --- Persistence ----------------------------------------------------------
  - id: cmd.scheduled-task
    technique: T1053.005
    confidence: high
    description: Scheduled task created.
    references:
      - https://attack.mitre.org/techniques/T1053/005/
    match:
      commands: [[schtasks, /create], register-scheduledtask, new-scheduledtask]

  - id: cmd.service-create
    technique: T1543.003
    confidence: high
    description: Windows service created from the command line.
    references:
      - https://attack.mitre.org/techniques/T1543/003/
    match:
      commands: [[sc, create, binpath], new-service]

  - id: cmd.run-key
    technique: T1547.001
    confidence: high
    description: Run, RunOnce or RunOnceEx registry value added from the command line.
    references:
      - https://attack.mitre.org/techniques/T1547/001/
    match:
      commands:
        - [reg, add, '\currentversion\run']
        - [reg, add, '\currentversion\runonce']
        - [reg, add, '\currentversion\runonceex']
        - [new-itemproperty, '\currentversion\run']
        - [set-itemproperty, '\currentversion\run']

  - id: cmd.wmi-event-subscription
    technique: T1546.003
    confidence: high
    description: WMI event filter or consumer created.
    references:
      - https://attack.mitre.org/techniques/T1546/003/
    match:
      commands: [__eventfilter, commandlineeventconsumer, activescripteventconsumer]

  - id: cmd.create-local-account
    technique: T1136.001
    confidence: high
    description: Local user account created.
    references:
      - https://attack.mitre.org/techniques/T1136/001/
    match:
      commands:
        - [net user, /add]
        - [net.exe user, /add]
        - [net1 user, /add]
        - [net1.exe user, /add]
        - new-localuser
      exclude_commands: [/domain, /dom]  # cmd.create-domain-account

  - id: cmd.create-domain-account
    technique: T1136.002
    confidence: high
    description: Domain user account created.
    references:
      - https://attack.mitre.org/techniques/T1136/002/
    match:
      commands:
        - [net user, /add, /domain]
        - [net.exe user, /add, /domain]
        - [net1 user, /add, /domain]
        - [net1.exe user, /add, /domain]
        - [net user, /add, /dom]
        - [net.exe user, /add, /dom]
        - [net1 user, /add, /dom]
        - [net1.exe user, /add, /dom]
        - new-aduser

  - id: cmd.add-to-group
    technique: T1098.007
    confidence: high
    description: Account added to a local or domain group, such as Administrators or Domain Admins.
    references:
      - https://attack.mitre.org/techniques/T1098/007/
    match:
      commands:
        - [net localgroup, /add]
        - [net.exe localgroup, /add]
        - [net1 localgroup, /add]
        - [net1.exe localgroup, /add]
        - [net group, /add]
        - [net.exe group, /add]
        - [net1 group, /add]
        - [net1.exe group, /add]
        - add-localgroupmember
        - add-adgroupmember

  - id: cmd.bits-job
    technique: T1197
    confidence: high
    description: BITS job created or used for transfer.
    references:
      - https://attack.mitre.org/techniques/T1197/
      - https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
    match:
      commands: [[bitsadmin, /transfer], [bitsadmin, /create], [bitsadmin, /addfile], start-bitstransfer]

  # --- Command and control / tool transfer -------------------------------------
  - id: cmd.download
    technique: T1105
    confidence: high
    description: File downloaded with a built-in tool or PowerShell download cradle.
    references:
      - https://attack.mitre.org/techniques/T1105/
      - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
    match:
      commands:
        - [certutil, -urlcache]
        - [certutil, /urlcache]
        - [certutil, -verifyctl]
        - [certutil, /verifyctl]
        - [bitsadmin, /transfer]
        - start-bitstransfer
        - downloadfile
        - downloadstring
        - downloaddata
        - invoke-webrequest
        - invoke-restmethod
        - [iwr, "http:"]
        - [iwr, "https:"]
        - [irm, "http:"]
        - [irm, "https:"]

  - id: cmd.decode
    technique: T1140
    confidence: high
    description: Encoded content decoded on the host.
    references:
      - https://attack.mitre.org/techniques/T1140/
    match:
      commands:
        - [certutil, -decode]
        - [certutil, /decode]
        - [certutil, -decodehex]
        - [certutil, /decodehex]
        - frombase64string

  # --- Defense impairment and stealth ------------------------------------------
  - id: cmd.disable-defender
    technique: T1685
    confidence: high
    description: Microsoft Defender disabled or given exclusions.
    references:
      - https://attack.mitre.org/techniques/T1685/
    match:
      commands:
        - [set-mppreference, -disablerealtimemonitoring]
        - [set-mppreference, -disableioavprotection]
        - [set-mppreference, -disablebehaviormonitoring]
        - [add-mppreference, -exclusionpath]
        - [add-mppreference, -exclusionprocess]
        - [add-mppreference, -exclusionextension]

  - id: cmd.disable-firewall
    technique: T1686
    confidence: high
    description: Windows Firewall disabled or opened.
    references:
      - https://attack.mitre.org/techniques/T1686/
    match:
      commands:
        - [netsh, advfirewall, state off]
        - [netsh, firewall, opmode, disable]
        - [netsh, advfirewall, firewall, add rule]

  - id: cmd.clear-event-logs
    technique: T1685.005
    confidence: high
    description: Windows event logs cleared.
    references:
      - https://attack.mitre.org/techniques/T1685/005/
    match:
      commands: [[wevtutil, cl], [wevtutil, clear-log], clear-eventlog]

  - id: cmd.file-deletion
    technique: T1070.004
    confidence: medium
    description: Forced or delayed file deletion, typical of self-deleting malware.
    references:
      - https://attack.mitre.org/techniques/T1070/004/
    match:
      commands: [[del, /f], [del, /q]]
      # Self-deletion waits in one command and deletes in the next: "ping 127.0.0.1 -n 3 & del x".
      chained_commands: [[ping, del], [timeout, del], [choice, del]]

  - id: cmd.hide-file
    technique: T1564.001
    confidence: high
    description: File hidden with attrib.
    references:
      - https://attack.mitre.org/techniques/T1564/001/
    match:
      commands: [[attrib, +h]]

  - id: cmd.modify-registry
    technique: T1112
    confidence: low
    description: Registry changed from the command line.
    references:
      - https://attack.mitre.org/techniques/T1112/
    match:
      commands: [[reg, add], [reg, delete]]

  # --- Credential access -------------------------------------------------------
  - id: cmd.lsass-dump
    technique: T1003.001
    confidence: high
    description: LSASS memory dumped or read by a credential tool.
    references:
      - https://attack.mitre.org/techniques/T1003/001/
    match:
      commands:
        - [comsvcs, minidump]
        - [procdump, lsass]
        - lsass.dmp
        - sekurlsa

  - id: cmd.sam-dump
    technique: T1003.002
    confidence: high
    description: SAM registry hive saved.
    references:
      - https://attack.mitre.org/techniques/T1003/002/
    match:
      commands: [[reg, save, 'hklm\sam'], [reg, save, 'hkey_local_machine\sam']]

  - id: cmd.ntds-dump
    technique: T1003.003
    confidence: high
    description: Active Directory database (NTDS.dit) accessed.
    references:
      - https://attack.mitre.org/techniques/T1003/003/
    match:
      commands: [ntdsutil, ntds.dit]

  # --- Discovery ---------------------------------------------------------------
  # net.exe subcommands are adjacent phrases so .NET type names (Net.WebClient)
  # and URL paths (example.net/view) cannot match. Lines that add or delete
  # accounts, group members, shares or sessions are not discovery.
  - id: cmd.system-info
    technique: T1082
    confidence: high
    description: System information queried.
    references:
      - https://attack.mitre.org/techniques/T1082/
    match:
      commands: [systeminfo, get-computerinfo]

  - id: cmd.network-config
    technique: T1016
    confidence: high
    description: Network configuration queried.
    references:
      - https://attack.mitre.org/techniques/T1016/
    match:
      commands: [ipconfig, [route, print], [netsh, interface, show]]
      # ipconfig switches that change state rather than query it
      exclude_commands: [
        /flushdns, /registerdns, /release, /release6, /renew, /renew6,
        -flushdns, -registerdns, -release, -release6, -renew, -renew6,
      ]

  - id: cmd.user-discovery
    technique: T1033
    confidence: high
    description: Current or logged-on users queried.
    references:
      - https://attack.mitre.org/techniques/T1033/
    match:
      commands: [whoami, quser, query user, query.exe user]

  - id: cmd.process-discovery
    technique: T1057
    confidence: high
    description: Running processes listed.
    references:
      - https://attack.mitre.org/techniques/T1057/
    match:
      commands: [tasklist, qprocess]

  - id: cmd.remote-system-discovery
    technique: T1018
    confidence: high
    description: Other hosts or domain controllers enumerated.
    references:
      - https://attack.mitre.org/techniques/T1018/
    match:
      commands: [net view, net.exe view, net1 view, net1.exe view, [arp, -a], [nltest, /dclist]]

  - id: cmd.domain-account-discovery
    technique: T1087.002
    confidence: high
    description: Domain accounts enumerated.
    references:
      - https://attack.mitre.org/techniques/T1087/002/
    match:
      commands:
        - [net user, /domain]
        - [net.exe user, /domain]
        - [net1 user, /domain]
        - [net1.exe user, /domain]
        - [net user, /dom]
        - [net.exe user, /dom]
        - [net1 user, /dom]
        - [net1.exe user, /dom]
        - get-aduser
      exclude_commands: [/add, /delete, /del]

  - id: cmd.domain-group-discovery
    technique: T1069.002
    confidence: high
    description: Domain groups enumerated.
    references:
      - https://attack.mitre.org/techniques/T1069/002/
    match:
      commands:
        - [net group, /domain]
        - [net.exe group, /domain]
        - [net1 group, /domain]
        - [net1.exe group, /domain]
        - [net group, /dom]
        - [net.exe group, /dom]
        - [net1 group, /dom]
        - [net1.exe group, /dom]
        - get-adgroupmember
      exclude_commands: [/add, /delete, /del]

  - id: cmd.local-group-discovery
    technique: T1069.001
    confidence: high
    description: Local groups enumerated.
    references:
      - https://attack.mitre.org/techniques/T1069/001/
    match:
      commands: [net localgroup, net.exe localgroup, net1 localgroup, net1.exe localgroup, get-localgroupmember]
      exclude_commands: [/add, /delete, /del]

  - id: cmd.domain-trust-discovery
    technique: T1482
    confidence: high
    description: Domain trusts enumerated.
    references:
      - https://attack.mitre.org/techniques/T1482/
    match:
      commands: [[nltest, /domain_trusts], [nltest, /trusted_domains], get-adtrust]

  - id: cmd.service-discovery
    technique: T1007
    confidence: medium
    description: Services enumerated.
    references:
      - https://attack.mitre.org/techniques/T1007/
    match:
      commands: [[sc, query], get-service]

  - id: cmd.time-discovery
    technique: T1124
    confidence: high
    description: System time or time zone queried.
    references:
      - https://attack.mitre.org/techniques/T1124/
    match:
      commands: [net time, net.exe time, net1 time, net1.exe time, [w32tm, /tz]]

  - id: cmd.security-software-discovery
    technique: T1518.001
    confidence: high
    description: Installed antivirus products queried.
    references:
      - https://attack.mitre.org/techniques/T1518/001/
    match:
      commands: [securitycenter2, antivirusproduct]

  - id: cmd.network-connections-discovery
    technique: T1049
    confidence: high
    description: Network connections or sessions listed.
    references:
      - https://attack.mitre.org/techniques/T1049/
    match:
      commands: [netstat, net session, net.exe session, net1 session, net1.exe session, get-nettcpconnection]
      exclude_commands: [/delete, /del]

  - id: cmd.share-discovery
    technique: T1135
    confidence: high
    description: Network shares enumerated.
    references:
      - https://attack.mitre.org/techniques/T1135/
    match:
      commands: [
        net share, net.exe share, net1 share, net1.exe share,
        net view, net.exe view, net1 view, net1.exe view,
        get-smbshare,
      ]
      # Creating, changing or deleting a share is not discovery: "net share C=C:\ /GRANT:...".
      exclude_commands: [
        /delete, /del, /grant, /users, /unlimited, /remark,
        net share <arg>=, net.exe share <arg>=, net1 share <arg>=, net1.exe share <arg>=,
        [net share, /cache], [net.exe share, /cache], [net1 share, /cache], [net1.exe share, /cache],
      ]

  # --- Lateral movement ----------------------------------------------------------
  - id: cmd.admin-shares
    technique: T1021.002
    confidence: medium
    description: Windows admin shares (ADMIN$, C$) referenced.
    references:
      - https://attack.mitre.org/techniques/T1021/002/
    match:
      commands: [admin$, '\c$', '\ipc$']

  # --- Impact --------------------------------------------------------------------
  - id: cmd.inhibit-recovery
    technique: T1490
    confidence: high
    description: Shadow copies, backups or boot recovery deleted or disabled.
    references:
      - https://attack.mitre.org/techniques/T1490/
    match:
      commands:
        - [vssadmin, delete shadows]
        - [vssadmin, resize, shadowstorage]
        - [wmic, shadowcopy, delete]
        - [win32_shadowcopy, delete]
        - [bcdedit, recoveryenabled no]
        - [bcdedit, bootstatuspolicy ignoreallfailures]
        - [wbadmin, delete, catalog]
        - [wbadmin, delete, systemstatebackup]

  - id: cmd.service-stop
    technique: T1489
    confidence: medium
    description: Services stopped, often databases or backups before encryption.
    references:
      - https://attack.mitre.org/techniques/T1489/
    match:
      commands:
        - net stop
        - net.exe stop
        - net1 stop
        - net1.exe stop
        - sc stop
        - sc.exe stop
        - ['sc \\', stop]
        - ['sc.exe \\', stop]
        - stop-service
