name: Feature request
description: Suggest an input format, IOC type, output format or rule set.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What analysis problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: example
    attributes:
      label: Example input (TLP:CLEAR only)
